<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI DSA Practice</title>

    <link rel="stylesheet" href="../CSS/aidsa.css">
</head>

<body>

    <div class="container">

        <h1>🤖 AI DSA Practice</h1>

        <p class="subtitle">
            Generate a DSA problem using AI and practice your coding skills.
        </p>

        <div class="setup">

            <label for="topic">
                Select Topic
            </label>

            <select id="topic">

                <option value="Arrays">
                    Arrays
                </option>

                <option value="Strings">
                    Strings
                </option>

                <option value="Linked List">
                    Linked List
                </option>

                <option value="Stack">
                    Stack
                </option>

                <option value="Queue">
                    Queue
                </option>

                <option value="Binary Search">
                    Binary Search
                </option>

                <option value="Trees">
                    Trees
                </option>

                <option value="Recursion">
                    Recursion
                </option>

                <option value="Sorting">
                    Sorting
                </option>

                <option value="Hashing">
                    Hashing
                </option>

            </select>

            <button id="generateBtn">
                Generate Problem
            </button>

        </div>

        <div id="loading">
            Generating problem...
        </div>

        <div id="result">

        </div>

    </div>

    <script src="../JS/aidsa.js"></script>

</body>

</html>
